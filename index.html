    <script>
      // Ensure window.fetch has a setter so libraries attempting to wrap/polyfill fetch do not crash in strict mode/sandboxed iframe
      (function() {
        try {
          if (typeof window !== 'undefined' && typeof window.fetch === 'function') {
            var nativeFetch = window.fetch.bind(window);
            var activeFetch = nativeFetch;
            Object.defineProperty(window, 'fetch', {
              get: function() {
                return activeFetch;
              },
              set: function(newFetch) {
                activeFetch = newFetch;
              },
              configurable: true,
              enumerable: true
            });
          }
        } catch (e) {
          // Graceful fallback if window.fetch cannot be reconfigured
        }
      })();
    </script>
